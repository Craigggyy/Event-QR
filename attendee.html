<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>EventPass — Browse Events</title>
<link rel="stylesheet" href="style.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
</head>
<body>

<div id="shell">

  <nav id="sidebar">
    <div class="sb-logo">
      <div class="sb-logo-icon">🎫</div>
      <div class="sb-logo-text">Event<span>Pass</span></div>
    </div>
    <button class="sb-toggle" onclick="toggleSidebar()">☰</button>

    <div class="sb-section">
      <div class="sb-section-label">Menu</div>
      <div class="sb-nav-item active" onclick="navigate('events')" id="nav-events">
        <span class="icon">🏠</span><span class="sb-nav-label">Browse Events</span>
      </div>
      <div class="sb-nav-item" onclick="navigate('my-tickets')" id="nav-my-tickets">
        <span class="icon">🎟</span><span class="sb-nav-label">My Tickets</span>
      </div>
    </div>

    <div class="sb-bottom">
      <div class="sb-user" id="sb-user-card">
        <div class="sb-user-avatar" id="sb-avatar">?</div>
        <div class="sb-user-info">
          <div class="sb-user-name" id="sb-name">Loading…</div>
          <div class="sb-user-role">Attendee</div>
        </div>
      </div>
      <button class="btn btn-ghost btn-sm btn-full" style="margin-top:8px" onclick="doLogout()">⬡ Sign Out</button>
    </div>
  </nav>

  <div id="main">

    <div id="topbar">
      <div class="topbar-title" id="topbar-title">Browse Events</div>
      <div class="topbar-right">
        <div class="topbar-badge">Attendee</div>
        <div class="notify-btn" title="Notifications">🔔<div class="notify-dot"></div></div>
      </div>
    </div>

    <div class="page active" id="page-events">
      <div style="display:flex;gap:12px;margin-bottom:20px">
        <div class="search-bar" style="flex:1">
          <span>🔍</span>
          <input type="text" id="event-search" placeholder="Search events, artists, venues…" oninput="filterEvents()">
        </div>
      </div>
      <div class="filter-row">
        <div class="filter-chip active" onclick="setFilter('all',this)">All Events</div>
        <div class="filter-chip" onclick="setFilter('Music',this)">🎵 Music</div>
        <div class="filter-chip" onclick="setFilter('Tech',this)">💻 Tech</div>
        <div class="filter-chip" onclick="setFilter('Art',this)">🎨 Art</div>
        <div class="filter-chip" onclick="setFilter('Food',this)">🍽 Food</div>
        <div class="filter-chip" onclick="setFilter('Sports',this)">⚽ Sports</div>
        <div class="filter-chip" onclick="setFilter('Business',this)">💼 Business</div>
      </div>
      <div class="events-grid" id="events-grid"></div>
    </div>

    <div class="page" id="page-my-tickets">
      <div class="sec-header">
        <div>
          <div class="sec-title">My Tickets</div>
          <div class="sec-sub">All your purchased event passes</div>
        </div>
      </div>
      <div id="my-tickets-list"></div>
    </div>

  </div></div><div class="modal-bg" id="event-detail-modal">
  <div class="modal modal-xl" id="event-detail-content"></div>
</div>

<div class="modal-bg" id="seat-modal">
  <div class="modal modal-lg">
    <div class="modal-header">
      <div class="modal-title">💺 Choose Your Seats</div>
      <div class="modal-close" onclick="closeModal('seat-modal')">✕</div>
    </div>
    <div class="modal-body" id="seat-modal-body"></div>
    <div class="modal-footer">
      <div id="seat-selection-status" style="font-size: 13px; color: var(--t3); flex: 1;">Selected 0 of 1</div>
      <button class="btn btn-ghost" onclick="closeModal('seat-modal')">Cancel</button>
      <button class="btn btn-primary" id="confirm-seat-btn" onclick="confirmSeatAndPay()" disabled>
        Confirm Selection & Pay →
      </button>
    </div>
  </div>
</div>

<div class="modal-bg" id="payment-modal">
  <div class="modal modal-sm">
    <div class="modal-header">
      <div class="modal-title">💳 Complete Payment</div>
      <div class="modal-close" onclick="closeModal('payment-modal')">✕</div>
    </div>
    <div class="modal-body">
      <div id="payment-summary" style="background:var(--bg2);border-radius:var(--r2);padding:14px;margin-bottom:20px;font-size:14px"></div>
      
      <div class="payment-methods">
        <div class="pm-btn active" onclick="selectPM(this,'card')"><span class="pm-icon">💳</span>Card</div>
        <div class="pm-btn" onclick="selectPM(this,'paypal')"><span class="pm-icon">🅿</span>PayPal</div>
        <div class="pm-btn" onclick="selectPM(this,'gcash')"><span class="pm-icon">📱</span>GCash</div>
      </div>

      <div id="card-form" class="pm-content">
        <div class="form-group">
          <label class="form-label">Cardholder Name</label>
          <input class="form-input" id="card-name" placeholder="Alex Chen">
        </div>
        <div class="form-group">
          <label class="form-label">Card Number</label>
          <input class="form-input" id="card-num" placeholder="4242 4242 4242 4242" maxlength="19" oninput="formatCard(this)">
        </div>
        <div class="card-input-row">
          <div class="form-group">
            <label class="form-label">Expiry</label>
            <input class="form-input" id="card-exp" placeholder="MM/YY" maxlength="5">
          </div>
          <div class="form-group">
            <label class="form-label">CVV</label>
            <input class="form-input" id="card-cvv" placeholder="•••" maxlength="3">
          </div>
        </div>
      </div>

      <div id="paypal-form" class="pm-content" style="display:none">
        <div class="form-group">
          <label class="form-label">PayPal Email Address</label>
          <input type="email" class="form-input" id="paypal-email" placeholder="example@email.com">
        </div>
        <div class="form-group">
          <label class="form-label">Password</label>
          <input type="password" class="form-input" id="paypal-password" placeholder="••••••••">
        </div>
      </div>

      <div id="gcash-form" class="pm-content" style="display:none">
        <div class="form-group">
          <label class="form-label">GCash Mobile Number</label>
          <input type="text" class="form-input" id="gcash-phone" placeholder="09XX XXX XXXX" maxlength="11">
        </div>
        <div class="form-group">
          <label class="form-label">4-Digit MPIN</label>
          <input type="password" class="form-input" id="gcash-mpin" placeholder="••••" maxlength="4">
        </div>
      </div>

    </div>
    <div class="modal-footer">
      <button class="btn btn-ghost" onclick="closeModal('payment-modal')">Cancel</button>
      <button class="btn btn-primary" id="pay-btn" onclick="processPayment()">Pay Now →</button>
    </div>
  </div>
</div>

<div class="modal-bg" id="ticket-view-modal">
  <div class="modal">
    <div class="modal-header">
      <div class="modal-title">🎫 Your Ticket</div>
      <div class="modal-close" onclick="closeModal('ticket-view-modal')">✕</div>
    </div>
    <div class="modal-body" id="ticket-view-body"></div>
    <div class="modal-footer">
      <button class="btn btn-ghost" onclick="closeModal('ticket-view-modal')">Close</button>
      <button class="btn btn-success" onclick="downloadTicket()">⬇ Download Ticket</button>
    </div>
  </div>
</div>

<div id="toast-container"></div>

<script src="functions.js"></script>
<script>
/* ── Auth guard & init ──────────────────────────────────── */
window.PAGE_TITLES = { 'events': 'Browse Events', 'my-tickets': 'My Tickets' };
let currentUser = null;

(function init() {
  currentUser = requireAuth('user');
  if (!currentUser) return;

  document.getElementById('sb-avatar').textContent = currentUser.name.charAt(0).toUpperCase();
  document.getElementById('sb-name').textContent   = currentUser.name;

  initModalListeners();

  // ✅ WAIT FOR FULL PAGE LAYOUT BEFORE FIRST RENDER
  window.onload = () => {
    requestAnimationFrame(() => {
      navigate('events');
      renderEvents();
    });
  };
})();

function doLogout() {
  clearSession();
  window.location.href = 'index.html';
}

window.onNavigate = function(page) {
  if (page === 'events') {
    requestAnimationFrame(() => {
      renderEvents();
    });
  }

  if (page === 'my-tickets') {
    requestAnimationFrame(() => {
      renderMyTickets();
    });
  }
};

/* ── FILTER & SEARCH ────────────────────────────────────── */
let currentFilter = 'all';
function setFilter(f, el) {
  currentFilter = f;
  document.querySelectorAll('.filter-chip').forEach(c => c.classList.remove('active'));
  el.classList.add('active');
  filterEvents();
}

function filterEvents() {
  const q = (document.getElementById('event-search').value || '').toLowerCase();
  const filtered = STORE.events.filter(e => {
    const matchCat = currentFilter === 'all' || e.category === currentFilter;
    const matchQ   = !q || e.title.toLowerCase().includes(q) || e.venue.toLowerCase().includes(q) || e.category.toLowerCase().includes(q);
    return matchCat && matchQ;
  });
  renderEventCards(filtered);
}

function renderEvents() {
  setTimeout(() => {
    filterEvents();
  }, 0);
}
function renderEventCards(events) {
  const grid = document.getElementById('events-grid');
  if (!events.length) {
    grid.innerHTML = `<div class="empty-state" style="grid-column:1/-1"><div class="empty-icon">🔍</div><div class="empty-title">No events found</div></div>`;
    return;
  }
  grid.innerHTML = events.map(e => {
    const takenCount = getTakenSeats(e.id).size;
    const remaining  = 100 - takenCount;
    const soldOut = remaining <= 0;
    const d = new Date(e.date);
    const month = d.toLocaleString('default', { month: 'short' }).toUpperCase();
    const day   = d.getDate();
    return `
    <div class="event-card" onclick="openEventDetail('${e.id}')">
      <div class="event-thumb" style="background:linear-gradient(135deg,${e.color}22,${e.color}44)">
        <span style="position:relative;z-index:1;filter:drop-shadow(0 4px 12px rgba(0,0,0,0.5))">${e.emoji}</span>
        <div class="event-category-badge">${e.category}</div>
        <div class="event-date-badge">${month}<br>${day}</div>
        ${soldOut ? `<div style="position:absolute;inset:0;background:rgba(0,0,0,0.6);display:flex;align-items:center;justify-content:center;color:white;font-weight:bold;z-index:2">SOLD OUT</div>` : ''}
      </div>
      <div class="event-body">
        <div class="event-title">${e.title}</div>
        <div class="event-meta">
          <div class="event-meta-item">📍 ${e.venue}</div>
        </div>
        <div class="event-footer">
          <div>${e.price === 0 ? `<div class="event-price-free">FREE</div>` : `<div class="event-price">₱${e.price.toLocaleString()}</div>`}</div>
          <div style="text-align:right">
            <div class="event-capacity">${remaining}/100 seats</div>
          </div>
        </div>
      </div>
    </div>`;
  }).join('');
}

/* ── EVENT DETAIL MODAL ─────────────────────────────────── */
let currentEventId = null;
let selectedTicketType = 'general';
let ticketQuantity = 1;

function openEventDetail(id) {
  const e = STORE.events.find(ev => ev.id === id);
  if (!e) return;
  currentEventId = id;
  selectedTicketType = 'general';
  ticketQuantity = 1;

  const takenCount = getTakenSeats(id).size;
  const remaining = 100 - takenCount;

  document.getElementById('event-detail-content').innerHTML = `
    <div class="event-detail-hero" style="background:linear-gradient(135deg,${e.color}33,${e.color}66)">
      <span style="font-size:80px">${e.emoji}</span>
      <div class="event-detail-info"><div class="event-detail-title">${e.title}</div></div>
    </div>
    <div class="detail-grid">
      <div>
        <div class="detail-section">
          <h3>About</h3>
          <p>${e.desc}</p>
        </div>
      </div>
      <div>
        <div class="ticket-box">
          <div class="ticket-box-title">Purchase Details</div>
          
          <div class="ticket-type-row selected" id="tt-general" onclick="selectTicketType('general')">
            <div><div class="ticket-type-name">General Admission</div></div>
            <div class="ticket-type-price">₱${e.price.toLocaleString()}</div>
          </div>
          ${e.vipPrice > 0 ? `
          <div class="ticket-type-row" id="tt-vip" onclick="selectTicketType('vip')">
            <div><div class="ticket-type-name">⭐ VIP Pass</div></div>
            <div class="ticket-type-price">₱${e.vipPrice.toLocaleString()}</div>
          </div>` : ''}

          <div style="margin: 20px 0;">
            <label style="font-size: 12px; color: var(--t3); display: block; margin-bottom: 8px;">QUANTITY (MAX 5)</label>
            <div style="display: flex; align-items: center; gap: 15px;">
              <button class="btn btn-sm btn-ghost" onclick="updateQty(-1)" style="padding: 5px 15px;">-</button>
              <span id="qty-val" style="font-weight: 700; font-size: 18px;">1</span>
              <button class="btn btn-sm btn-ghost" onclick="updateQty(1)" style="padding: 5px 15px;">+</button>
            </div>
          </div>

          <div class="ticket-total">
            <span>Subtotal</span>
            <span id="detail-subtotal">₱${e.price.toLocaleString()}</span>
          </div>
          <button class="btn btn-primary btn-full" style="margin-top:16px" 
            onclick="${remaining <= 0 ? "toast('Sold out','err')" : "openSeatModal()"}">
            ${remaining <= 0 ? 'Sold Out' : 'Choose Seats →'}
          </button>
        </div>
      </div>
    </div>
    <div class="modal-footer"><button class="btn btn-ghost" onclick="closeModal('event-detail-modal')">Close</button></div>`;

  openModal('event-detail-modal');
}

function updateQty(delta) {
  const newQty = ticketQuantity + delta;
  if (newQty >= 1 && newQty <= 5) {
    ticketQuantity = newQty;
    document.getElementById('qty-val').textContent = ticketQuantity;
    updateDetailPrices();
  }
}

function selectTicketType(type) {
  selectedTicketType = type;
  document.querySelectorAll('.ticket-type-row').forEach(r => r.classList.remove('selected'));
  document.getElementById(`tt-${type}`)?.classList.add('selected');
  updateDetailPrices();
}

function updateDetailPrices() {
  const e = STORE.events.find(ev => ev.id === currentEventId);
  const base = selectedTicketType === 'vip' ? e.vipPrice : e.price;
  document.getElementById('detail-subtotal').textContent = '₱' + (base * ticketQuantity).toLocaleString();
}

/* ── SEAT MAP MODAL ─────────────────────────────────────── */
let selectedSeats = [];

function openSeatModal() {
  const e = STORE.events.find(ev => ev.id === currentEventId);
  selectedSeats = [];
  const takenSeats = getTakenSeats(currentEventId);
  const isVIPMode = selectedTicketType === 'vip';

  let gridHTML = ROWS.map(row => {
    const isVIPRow = isSeatVIP(row);
    let cells = `<div class="seat-row-label">${row}</div>`;
    for (let col = 1; col <= 10; col++) {
      const seatId = getSeatId(row, col);
      const isTaken = takenSeats.has(seatId);
      const wrongType = isVIPMode ? !isVIPRow : isVIPRow;
      
      let cls = 'seat-btn';
      if (isVIPRow) cls += ' vip';
      if (isTaken || wrongType) cls += ' taken';

      const onclick = (!isTaken && !wrongType) ? `toggleSeat('${seatId}')` : '';
      cells += `<button id="seat-${seatId}" class="${cls}" ${onclick ? `onclick="${onclick}"` : 'disabled'}>${isTaken ? '✕' : col}</button>`;
    }
    return cells;
  }).join('');

  document.getElementById('seat-modal-body').innerHTML = `
    <div class="seat-map-stage">🎭 STAGE / SCREEN</div>
    <div class="seat-grid">${gridHTML}</div>`;
  
  updateSeatStatus();
  openModal('seat-modal');
}

function toggleSeat(seatId) {
  const idx = selectedSeats.indexOf(seatId);
  if (idx > -1) {
    selectedSeats.splice(idx, 1);
    document.getElementById(`seat-${seatId}`).classList.remove('selected');
  } else {
    if (selectedSeats.length >= ticketQuantity) {
      toast(`You can only select ${ticketQuantity} seats`, 'err');
      return;
    }
    selectedSeats.push(seatId);
    document.getElementById(`seat-${seatId}`).classList.add('selected');
  }
  updateSeatStatus();
}

function updateSeatStatus() {
  const status = document.getElementById('seat-selection-status');
  const btn = document.getElementById('confirm-seat-btn');
  status.textContent = `Selected ${selectedSeats.length} of ${ticketQuantity} seats`;
  btn.disabled = (selectedSeats.length !== ticketQuantity);
}

function confirmSeatAndPay() {
  closeModal('seat-modal');
  openPaymentModal();
}

/* ── PAYMENT ────────────────────────────────────────────── */
let selectedPM = 'card';

function openPaymentModal() {
  const e = STORE.events.find(ev => ev.id === currentEventId);
  const base = selectedTicketType === 'vip' ? e.vipPrice : e.price;
  const subtotal = base * ticketQuantity;
  const fee = 100;
  const total = subtotal + fee;

  document.getElementById('payment-summary').innerHTML = `
    <div style="font-weight:700">${e.title}</div>
    <div style="font-size:12px;color:var(--t3);margin:5px 0;">
      ${ticketQuantity}x ${selectedTicketType.toUpperCase()} · Seats: ${selectedSeats.join(', ')}
    </div>
    <div style="display:flex;justify-content:space-between;font-size:12px;margin-top:10px">
      <span>Subtotal</span><span>₱${subtotal.toLocaleString()}</span>
    </div>
    <div style="display:flex;justify-content:space-between;font-size:12px">
      <span>Service fee (₱100)</span><span>₱${fee.toLocaleString()}</span>
    </div>
    <div style="display:flex;justify-content:space-between;font-weight:700;margin-top:10px;font-size:16px;border-top:1px solid var(--border);padding-top:10px">
      <span>Total</span><span>₱${total.toLocaleString()}</span>
    </div>`;

  document.getElementById('pay-btn').textContent = `Pay ₱${total.toLocaleString()} →`;
  openModal('payment-modal');
}

function selectPM(el, pm) {
  selectedPM = pm;
  document.querySelectorAll('.pm-btn').forEach(b => b.classList.remove('active'));
  el.classList.add('active');
  
  // Toggle form visibility
  document.getElementById('card-form').style.display = pm === 'card' ? 'block' : 'none';
  document.getElementById('paypal-form').style.display = pm === 'paypal' ? 'block' : 'none';
  document.getElementById('gcash-form').style.display = pm === 'gcash' ? 'block' : 'none';
}

function processPayment() {
  const e = STORE.events.find(ev => ev.id === currentEventId);
  const btn = document.getElementById('pay-btn');
  
  // Basic validation check based on method
  if (selectedPM === 'card' && document.getElementById('card-num').value.length < 16) { toast('Invalid card info', 'err'); return; }
  if (selectedPM === 'paypal' && !document.getElementById('paypal-email').value.includes('@')) { toast('Invalid PayPal email', 'err'); return; }
  if (selectedPM === 'gcash' && document.getElementById('gcash-phone').value.length < 11) { toast('Invalid GCash number', 'err'); return; }

  btn.textContent = '⏳ Processing…';
  btn.disabled = true;

  setTimeout(() => {
    selectedSeats.forEach(seat => {
      STORE.tickets.push({
        id: generateTicketId(),
        userId: currentUser.id,
        userName: currentUser.name,
        userEmail: currentUser.email,
        eventId: currentEventId,
        type: selectedTicketType,
        seat: seat,
        purchaseDate: new Date().toISOString(),
        status: 'valid'
      });
    });
    saveStore();
    closeModal('payment-modal');
    closeModal('event-detail-modal');
    toast(`🎫 ${ticketQuantity} tickets purchased successfully!`, 'ok');
    navigate('my-tickets');
  }, 2000);
}

/* ── MY TICKETS ─────────────────────────────────────────── */
function renderMyTickets() {
  const userTickets = STORE.tickets.filter(t => t.userId === currentUser.id).reverse();
  const list = document.getElementById('my-tickets-list');
  if (!userTickets.length) {
    list.innerHTML = `<div class="empty-state">No tickets yet</div>`;
    return;
  }
  list.innerHTML = userTickets.map(t => {
    const ev = STORE.events.find(e => e.id === t.eventId) || {};
    return `
      <div class="ticket-card">
        <div class="ticket-left">
          <div class="ticket-event-name">${ev.title}</div>
          <div class="ticket-meta">
            <div class="ticket-meta-item">💺 Seat <strong>${t.seat}</strong> · ${t.type.toUpperCase()}</div>
          </div>
          <div class="ticket-actions">
            <button class="btn btn-sm btn-ghost" onclick="viewTicket('${t.id}')">View QR</button>
          </div>
        </div>
        <div class="ticket-right"><div class="qr-container" id="qr-mini-${t.id}"></div></div>
      </div>`;
  }).join('');

  userTickets.forEach(t => {
    setTimeout(() => generateQR(`qr-mini-${t.id}`, { id: t.id }, 80), 100);
  });
}

function viewTicket(id) {
  const t = STORE.tickets.find(tk => tk.id === id);
  const e = STORE.events.find(ev => ev.id === t.eventId);
  document.getElementById('ticket-view-body').innerHTML = `
    <div class="printable-ticket" id="printable-${t.id}">
      <div class="pt-event-name">${e.title}</div>
      <div class="pt-meta">
        <div class="pt-meta-item"><strong>Seat</strong>${t.seat}</div>
        <div class="pt-meta-item"><strong>Attendee</strong>${t.userName}</div>
      </div>
      <div id="qr-full-${t.id}" style="display:flex;justify-content:center;margin-top:20px"></div>
    </div>`;
  openModal('ticket-view-modal');
  setTimeout(() => generateQR(`qr-full-${t.id}`, { id: t.id }, 120), 200);
}
</script>
</body>
</html>

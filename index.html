<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>EventPass — Sign In</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<!-- ═══════════════ AUTH PAGE ═══════════════ -->
<div id="auth-page">
  <div class="auth-card">
    <div class="auth-logo">
      <div class="auth-logo-icon">🎫</div>
      <h1>EventPass</h1>
      <p>Your all-in-one event ticketing platform</p>
    </div>

    <div class="auth-tabs">
      <div class="auth-tab active" onclick="switchAuthTab('login')">Sign In</div>
      <div class="auth-tab" onclick="switchAuthTab('register')">Create Account</div>
    </div>

    <!-- LOGIN -->
    <div id="login-form">
      <div class="form-group">
        <label class="form-label">Email Address</label>
        <input class="form-input" id="login-email" type="email" placeholder="you@example.com">
      </div>
      <div class="form-group">
        <label class="form-label">Password</label>
        <input class="form-input" id="login-pass" type="password" placeholder="••••••••"
               onkeydown="if(event.key==='Enter') doLogin()">
      </div>
      <div class="checkbox-row">
        <input type="checkbox" id="remember">
        <label for="remember">Remember me for 30 days</label>
      </div>
      <button class="btn btn-primary btn-full btn-lg" onclick="doLogin()">Sign In →</button>
      <div style="text-align:center;margin-top:20px;font-size:13px;color:var(--t3);line-height:1.8">
        <strong style="color:var(--t2)">Demo Accounts</strong><br>
        Admin: <b style="color:var(--p2)">admin</b> / <b style="color:var(--p2)">123</b><br>
        User:&nbsp;&nbsp;<b style="color:var(--p2)">user</b> / <b style="color:var(--p2)">123</b>
      </div>
    </div>

    <!-- REGISTER -->
    <div id="register-form" style="display:none">
      <div class="form-row">
        <div class="form-group">
          <label class="form-label">First Name</label>
          <input class="form-input" id="reg-fname" type="text" placeholder="Alex">
        </div>
        <div class="form-group">
          <label class="form-label">Last Name</label>
          <input class="form-input" id="reg-lname" type="text" placeholder="Chen">
        </div>
      </div>
      <div class="form-group">
        <label class="form-label">Email Address</label>
        <input class="form-input" id="reg-email" type="email" placeholder="you@example.com">
      </div>
      <div class="form-group">
        <label class="form-label">Password</label>
        <input class="form-input" id="reg-pass" type="password" placeholder="Min. 6 characters">
      </div>
      <div class="form-group">
        <label class="form-label">I am a…</label>
        <select class="form-input form-select" id="reg-role">
          <option value="user">Attendee — I want to buy tickets</option>
          <option value="admin">Event Organizer — I want to manage events</option>
        </select>
      </div>
      <button class="btn btn-primary btn-full btn-lg" onclick="doRegister()">Create Account →</button>
    </div>
  </div>
</div>

<!-- TOAST -->
<div id="toast-container"></div>

<script src="functions.js"></script>
<script>
/* ── Redirect if already logged in ─────────────────────── */
(function() {
  const s = getSession();
  if (s) {
    window.location.href = s.role === 'admin' ? 'admin.html' : 'attendee.html';
  }
})();

/* ── Tab switch ─────────────────────────────────────────── */
function switchAuthTab(tab) {
  document.querySelectorAll('.auth-tab').forEach((t, i) =>
    t.classList.toggle('active', i === (tab === 'login' ? 0 : 1))
  );
  document.getElementById('login-form').style.display    = tab === 'login'    ? 'block' : 'none';
  document.getElementById('register-form').style.display = tab === 'register' ? 'block' : 'none';
}

/* ── Login ──────────────────────────────────────────────── */
function doLogin() {
  const email = document.getElementById('login-email').value.trim();
  const pass  = document.getElementById('login-pass').value;
  if (!email || !pass) { toast('Please enter email and password', 'err'); return; }

  const user = STORE.users.find(u => u.email === email && u.password === pass);
  if (!user) { toast('Invalid email or password', 'err'); return; }

  setSession(user);
  toast(`Welcome back, ${user.name.split(' ')[0]}! 👋`, 'ok');
  setTimeout(() => {
    window.location.href = user.role === 'admin' ? 'admin.html' : 'attendee.html';
  }, 600);
}

/* ── Register ───────────────────────────────────────────── */
function doRegister() {
  const fname = document.getElementById('reg-fname').value.trim();
  const lname = document.getElementById('reg-lname').value.trim();
  const email = document.getElementById('reg-email').value.trim();
  const pass  = document.getElementById('reg-pass').value;
  const role  = document.getElementById('reg-role').value;

  if (!fname || !email || !pass) { toast('Please fill all required fields', 'err'); return; }
  if (STORE.users.find(u => u.email === email)) { toast('Email already registered', 'err'); return; }
  if (pass.length < 6) { toast('Password must be at least 6 characters', 'err'); return; }

  const user = { id: 'u' + Date.now(), email, password: pass, name: `${fname} ${lname}`, role };
  STORE.users.push(user);
  saveStore();
  setSession(user);

  toast('Account created successfully!', 'ok');
  setTimeout(() => {
    window.location.href = user.role === 'admin' ? 'admin.html' : 'attendee.html';
  }, 600);
}
</script>
</body>
</html>
